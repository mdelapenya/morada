name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit and server tests
        run: npm test
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Browser UI tests
        run: npm run test:ui
      - name: Build
        run: npm run build
      - name: Upload application build
        uses: actions/upload-artifact@v5
        with:
          name: idealista-app
          path: dist/
          if-no-files-found: error
          retention-days: 7
